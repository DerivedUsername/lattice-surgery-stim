[project]
name = "lattice-surgery-stim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Qiyu", email = "jackzhangqiyu@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pymatching>=2.4.0",
    "stim>=1.16.0",
]

[project.scripts]
lattice-surgery-stim = "lattice_surgery_stim:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
